<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ficha médica de emergencia</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #dde2ea;
    --red: #c1121f;
    --green: #128c4a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; }
  .banner {
    background: var(--red);
    color: #fff;
    border-radius: 14px 14px 0 0;
    padding: 14px 20px;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 14px 14px;
    padding: 20px;
  }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 4px; }
  .nac { margin: 0 0 20px; color: var(--muted); }
  .blood {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .blood b { font-size: 3rem; line-height: 1; color: var(--red); }
  .blood span { color: var(--muted); }
  dl { margin: 0; }
  .row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  dt { font-size: .9rem; color: var(--muted); margin-bottom: 2px; }
  dd { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .actions { display: grid; gap: 12px; margin-top: 20px; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px;
    border-radius: 12px;
    color: #fff;
  }
  .wa { background: var(--green); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .note { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <div class="banner">Ficha médica de emergencia</div>
  <div class="card">
    <h1>GUIMERA GAUNA XIMENA SOLEDAD</h1>
    <p class="nac">Nacionalidad: Argentina</p>

    <div class="blood">
      <b>O+</b>
      <span>Factor sanguíneo</span>
    </div>

    <dl>
      <div class="row">
        <dt>DNI</dt>
        <dd>32.956.153</dd>
      </div>
      <div class="row">
        <dt>Medicación</dt>
        <dd>Venlafaxina, triptanol</dd>
      </div>
      <div class="row">
        <dt>Celular</dt>
        <dd>291 4460195</dd>
      </div>
    </dl>

    <div class="actions">
      <a class="btn wa" href="https://wa.me/5492914460195">Escribir por WhatsApp</a>
    </div>
  </div>
  <p class="note">En caso de emergencia, llamá al 107 (SAME) o al 911.</p>
</main>
</body>
</html>
